name: CI

on:
  push:
    branches: [main, devops]
  pull_request:

# um push novo cancela a verificação anterior do mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # os testes do modo API rodam a tela contra o backend real (em memória)
      - name: Instalar dependências do backend (testes do modo API)
        run: npm ci
        working-directory: backend

      - name: Lint (qualquer aviso reprova)
        run: npm run lint

      - name: Checagem de tipos (inclui os testes)
        run: npm run typecheck

      - name: Testes com cobertura mínima de 95%
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  backend:
    name: Backend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # o checkout inteiro: o backend usa as regras de negócio de frontend/src/lib
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (qualquer aviso reprova)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes com cobertura mínima de 95%
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-backend
          path: backend/coverage
          if-no-files-found: ignore

  oracle:
    name: Oracle (esquema, repositório e API contra um banco real)
    needs: [backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Oracle 23ai Free só para este job (o mesmo do db/README.md); nada é instalado na máquina de ninguém
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: admin-ci-123
          APP_USER: playoff
          APP_USER_PASSWORD: playoff123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ORACLE_USER: playoff
      ORACLE_PASSWORD: playoff123
      ORACLE_CONNECT_STRING: localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar as tabelas (db/000_drop.sql + db/001_schema.sql)
        run: npm run db:schema

      # todos os testes da API, agora gravando e lendo do Oracle
      - name: Testes da API e do repositório contra o Oracle
        run: npm run test:oracle

      - name: Carga dos dados de demonstração (npm run db:seed)
        run: |
          npm run db:schema
          npm run db:seed

  e2e:
    name: Ponta a ponta (navegador + API)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # sobe a API (em memória) e o frontend compilado apontando para ela
      - name: Testes de ponta a ponta
        run: npm run e2e
        working-directory: frontend

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
