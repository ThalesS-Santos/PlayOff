name: CI

on:
  push:
    branches: [main, devops]
  pull_request:

# um push novo cancela a verificação anterior do mesmo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (qualquer aviso reprova)
        run: npm run lint

      - name: Checagem de tipos (inclui os testes)
        run: npm run typecheck

      - name: Testes com cobertura mínima de 95%
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  backend:
    name: Backend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # o checkout inteiro: o backend usa as regras de negócio de frontend/src/lib
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (qualquer aviso reprova)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes com cobertura mínima de 95%
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
          if-no-files-found: ignore
